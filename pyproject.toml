[project]
name = "mcp-mysql-server"
version = "0.1.0"
description = "Model Context Protocol server for MySQL databases"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0",
    "PyMySQL>=1.1.0",
    "python-dotenv>=1.0.0",
    "anthropic>=0.69.0",
]

[project.optional-dependencies]
voice = [
    "SpeechRecognition>=3.10.0",
    "pyttsx3>=2.90",
    "PyAudio>=0.2.13",
]

[project.scripts]
mcp-mysql-server = "mcp_mysql_server.server:main"
jarvis = "jarvis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_mysql_server", "jarvis"]
