[project]
name = "python-projects"
version = "0.1.0"
description = "Python projects: MCP server for MySQL, Slack agent powered by Claude"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0",
    "PyMySQL>=1.1.0",
    "python-dotenv>=1.0.0",
    "anthropic>=0.49.0",
    "slack-bolt>=1.21.0",
]

[project.scripts]
mcp-mysql-server = "mcp_mysql_server.server:main"
slack-claude-agent = "slack_claude_agent.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_mysql_server", "slack_claude_agent"]
