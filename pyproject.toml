[project]
name = "python-projects"
version = "0.1.0"
description = "A small monorepo of Python projects (MCP servers and an AI knowledge agent)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0",
    "PyMySQL>=1.1.0",
    "python-dotenv>=1.0.0",
    "anthropic>=0.49.0",
    "httpx>=0.27.0",
    "trafilatura>=1.12.0",
    "ddgs>=6.0.0",
]

[project.scripts]
mcp-mysql-server = "mcp_mysql_server.server:main"
ai-knowledge-mcp = "ai_knowledge_agent.mcp_server:main"
ai-knowledge-agent = "ai_knowledge_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_mysql_server", "ai_knowledge_agent"]
