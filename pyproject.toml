[project]
name = "mcp-mysql-server"
version = "0.2.0"
description = "Model Context Protocol server for MySQL databases"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0",
    "PyMySQL>=1.1.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
mcp-mysql-server = "mcp_mysql_server.server:main"
mcp-mysql-evals = "evals.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_mysql_server", "evals"]
