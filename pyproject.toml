[project]
name = "python-projects"
version = "0.1.0"
description = "Small Python projects: MCP MySQL server, live gas price tracker"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0",
    "PyMySQL>=1.1.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[project.scripts]
mcp-mysql-server = "mcp_mysql_server.server:main"
gas-tracker = "gas_tracker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_mysql_server", "gas_tracker"]
