[project]
name = "mcp-mysql-server"
version = "0.1.0"
description = "Model Context Protocol server for MySQL databases"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0",
    "PyMySQL>=1.1.0",
    "python-dotenv>=1.0.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langgraph>=0.2.0",
    "pydantic>=2.7",
]

[project.scripts]
mcp-mysql-server = "mcp_mysql_server.server:main"
tag-text = "tag_system.cli:main"
tag-agent = "tag_system.agent_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_mysql_server", "tag_system"]
