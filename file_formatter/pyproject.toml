[project]
name = "file-formatter"
version = "0.1.0"
description = "A pluggable file formatter with user-defined formatting skills"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
file-formatter = "file_formatter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["file_formatter"]
